# Scheduler for /api/cron/retry-meta-capi (Meta Conversions API retry sweep).
#
# The app has no built-in scheduler, so this pings the route every 10
# minutes. The route is authorised by CRON_SECRET (Authorization: Bearer).
#
# SETUP (once): GitHub repo → Settings → Secrets and variables → Actions →
# New repository secret → name CRON_SECRET, value = the SAME CRON_SECRET
# set in the hosting environment.
#
# Notes:
#  - GitHub runs `schedule` workflows only from the DEFAULT branch (main).
#  - Schedules are best-effort: a run can start a few minutes late.
#  - Run it by hand any time: Actions → "Retry Meta CAPI" → Run workflow.

name: Retry Meta CAPI

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retry-meta-capi
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call retry-meta-capi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set" >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.punyata.com/api/cron/retry-meta-capi"
          echo
