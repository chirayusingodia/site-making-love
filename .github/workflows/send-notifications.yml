# Scheduler for /api/cron/send-notifications (WhatsApp notifications sweep).
# A telecaller's payment link should reach the customer within a few
# minutes of her click, so this runs every 5 minutes (GitHub's minimum).
#
# SETUP (once): repo → Settings → Secrets and variables → Actions →
# repository secret CRON_SECRET = the SAME value as the CRON_SECRET env
# var in the hosting environment. Runs only from the default branch (main).
# Manual run: Actions → "Send notifications" → Run workflow.

name: Send notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-notifications
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call send-notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set" >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.punyata.com/api/cron/send-notifications"
          echo
